[project]
name = "sqlproj-atlas"
version = "1.7.0"
description = "Wtyczka Claude Code: analiza projektów SSDT (SQL Server) silnikiem Microsoft DacFx, mapa architektury w lokalnej aplikacji webowej."
requires-python = ">=3.12"
authors = [{ name = "Kordian Dziuła", email = "kordian.dziula@wp.pl" }]
license = "MIT"
dependencies = [
    "mcp>=2.3",          # oficjalny SDK Model Context Protocol (serwer narzędzi dla Claude'a)
    "fastapi>=0.140",    # REST API lokalnej aplikacji webowej
    "uvicorn>=0.50",     # serwer HTTP dla FastAPI
    "sqlalchemy>=2.1",   # baza SQLite (ORM)
    "pydantic>=2.13",    # modele danych (wynik silnika, poprawki użytkownika, żądania API)
    "typer>=0.27",       # linia poleceń
    "gitpython>=3.2",    # historia git (commity, diffy)
    "wcmatch>=11.0",     # wzorce plików MSBuild (**, *, ?)
    "httpx>=0.28",       # sprawdzenie, czy aplikacja webowa z ui.lock odpowiada
]

[project.scripts]
sqlproj-atlas = "sqlproj_atlas.cli:app"

[dependency-groups]
dev = ["pytest>=9", "pytest-cov>=7", "hypothesis>=6", "playwright>=1.50", "ruff>=0.16"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
# uv instaluje tylko biblioteki z uv.lock; kod wtyczki ładuje się z src/ (PYTHONPATH w scripts/atlas).
# Dzięki temu kilka sesji i wersji wtyczki dzieli jedno środowisko bez przeinstalowywania pakietu.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/fixtures"]
addopts = "-ra"
# przestarzałe API użyte w kodzie wtyczki oblewa testy (zamiast cicho czekać na usunięcie w kolejnej wersji biblioteki)
filterwarnings = ["error::DeprecationWarning:sqlproj_atlas.*"]
markers = ["ui: testy interfejsu w przeglądarce (Playwright); pominięcie: -m \"not ui\""]

[tool.ruff.lint.isort]
known-first-party = ["sqlproj_atlas"]
known-local-folder = ["builders", "conftest", "make_test_project", "mcp_client"]

[tool.coverage.run]
source = ["sqlproj_atlas"]
patch = ["subprocess"]  # liczy też kod serwera MCP uruchamianego przez testy e2e w osobnym procesie
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 97  # pytest --cov oblewa przebieg, gdy pokrycie spadnie (zapas na kod innych systemów niż bieżący)
